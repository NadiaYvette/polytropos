# ==============================================================================
# Brittany Configuration for Polytropos Downstream Packages
# https://github.com/lspitzner/brittany
#
# Copy this file to your project root as `.brittany.yaml` to ensure clean
# alignment for type-level row lists and language extension forwarding.
# ==============================================================================

conf_version: 1

conf_forward:
  options_ghc:
    - "-XDataKinds"
    - "-XTypeOperators"
    - "-XOverloadedRecordDot"
    - "-XFlexibleContexts"

conf_layout:
  lconfig_cols: 100
  lconfig_indentAmount: 2
  lconfig_indentListSpecial: true
  lconfig_indentWhereSpecial: true
  lconfig_alignmentBreakOnMultiline: true
  lconfig_columnAlignMode:
    tag: ColumnAlignModeMajority
    contents: 0.7
  lconfig_allowHangingQuasiQuotes: true
  lconfig_importColumn: 50
  lconfig_importAsColumn: 50
