# Stack configuration for GHC 9.14 (primary toolchain)
snapshot:
  compiler: ghc-9.14.1

system-ghc: true
install-ghc: false
allow-newer: true

packages:
  - packages/polytropos-core
  - packages/polytropos-plugin

extra-deps:
  - ghc-tcplugin-api-0.20.1.0
  - primitive-0.9.1.0
  - tasty-1.5.3
  - tasty-hunit-0.10.2
  - ansi-terminal-1.1.2
  - ansi-terminal-types-1.1
  - colour-2.3.6
  - call-stack-0.4.0
  - optparse-applicative-0.18.1.0
  - prettyprinter-1.7.1
  - prettyprinter-ansi-terminal-1.1.3
  - tagged-0.8.9
  - transformers-compat-0.7.2
