---
id: task-05-overloaded-labels-and-record-update
title: Support OverloadedLabels (#field) and OverloadedRecordUpdate (r { x = 1 }) syntax
description: |
  Enables first-class ergonomic field access and record updates on `polytropos` records:
  1. `OverloadedLabels`:
     Implements `GHC.OverloadedLabels.IsLabel (l :: Symbol) (Field l)` so that `#foo`
     acts as a type-safe field witness.
  2. `OverloadedRecordUpdate`:
     Enables Haskell standard record update syntax `r { x = 10, y = True }` by solving
     the update dictionary through the TcPlugin, directly emitting a batched call
     to `setFieldsAt [(idxX, 10), (idxY, True)]` with statically resolved offsets.

dependencies:
  - task-04-plugin-hasfield-overloaded-record-dot

packages:
  - packages/polytropos-plugin
  - packages/polytropos-core

executor: agy
model: "mistral/codestral-latest"
skills:
  - tricorder
  - code-navigation
max_turns: 10
run_budget: 450
max_repair_attempts: 3

steps:
  - id: implement-islabel
    name: Define IsLabel instance for Field witnesses
    action: |
      In `packages/polytropos-core/src/Polytropos/Core.hs`:
      1. Define `data Field (n :: Symbol) = Field`.
      2. Import `GHC.OverloadedLabels (IsLabel(..))`.
      3. Implement `instance (l ~ l') => IsLabel l (Field l') where fromLabel = Field`.
    duration: "15m"

  - id: solve-record-update
    name: Implement OverloadedRecordUpdate solving in TcPlugin
    action: |
      In `packages/polytropos-plugin/src/Polytropos/Plugin.hs`:
      1. Intercept `setField` / `HasField` setter constraints generated by `OverloadedRecordUpdate`.
      2. When updating multiple fields, group the target field names and map each to its
         literal index.
      3. Synthesize Core expression applying `setFieldsAt` with the static list of `(index, value)` pairs.
    duration: "35m"

  - id: add-syntax-tests
    name: Add syntax tests
    action: |
      In `packages/polytropos-plugin/tests/smoke/Main.hs`:
      1. Verify `#field` creates valid `Field` witnesses.
      2. Verify record update syntax: `let r' = r { x = 10, y = False }` updates both fields in a single batch.
    duration: "15m"

  - id: verify-gate
    name: Run verification gate
    action: |
      Run `cabal test all`.
    duration: "5m"

success_criteria:
  - `#field` compiles without errors.
  - Multi-field `r { x = 1, y = 2 }` updates desugar into `setFieldsAt`.
  - All tests in `cabal test all` pass with zero warnings.
